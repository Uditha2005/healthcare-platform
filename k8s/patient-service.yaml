apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: patient-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3002
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/healthcare"
        - name: JWT_SECRET
          value: "your_super_secret_jwt_key_2024"
        - name: PORT
          value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector:
    app: patient-service
  ports:
  - port: 3002
    targetPort: 3002
  type: ClusterIP
