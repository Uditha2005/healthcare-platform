apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-symptom-service
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      containers:
      - name: ai-symptom-service
        image: ai-symptom-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3006
        env:
        - name: JWT_SECRET
          value: "your-jwt-secret"
        - name: GEMINI_API_KEY
          value: "your-gemini-api-key"
        - name: GEMINI_MODEL
          value: "gemini-2.5-flash"
        - name: GEMINI_BASE_URL
          value: "https://generativelanguage.googleapis.com/v1beta"
        - name: PORT
          value: "3006"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
spec:
  selector:
    app: ai-symptom-service
  ports:
  - port: 3006
    targetPort: 3006
  type: ClusterIP
