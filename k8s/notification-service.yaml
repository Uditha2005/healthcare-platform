apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/healthcare"
        - name: JWT_SECRET
          value: "your-jwt-secret"
        - name: SMTP_HOST
          value: "smtp.sendgrid.net"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_SECURE
          value: "false"
        - name: SMTP_USER
          value: "apikey"
        - name: SMTP_PASS
          value: "your-sendgrid-api-key"
        - name: SMTP_FROM
          value: "noreply@yourdomain.com"
        - name: NOTIFYLK_USER_ID
          value: "31493"
        - name: NOTIFYLK_API_KEY
          value: "your-notifylk-api-key"
        - name: NOTIFYLK_SENDER_ID
          value: "NotifyDEMO"
        - name: NOTIFYLK_API_BASE_URL
          value: "https://app.notify.lk/api/v1"
        - name: PORT
          value: "3005"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP
