apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: payment-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: MONGO_URI
          value: "mongodb://mongo:27017/healthcare"
        - name: JWT_SECRET
          value: "your-jwt-secret"
        - name: STRIPE_SECRET_KEY
          value: "sk_test_your_key"
        - name: STRIPE_WEBHOOK_SECRET
          value: "whsec_your_webhook_secret"
        - name: PORT
          value: "3004"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - port: 3004
    targetPort: 3004
  type: ClusterIP
